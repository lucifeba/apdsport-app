services:
  apd-client-agent:
    build: .
    container_name: apd-client-agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - apd-client-agent-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/apd-client-agent.sqlite"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  apd-client-agent-data:
